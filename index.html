<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AFB Brifing</title>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>
  :root{
    --navy:#0A1F44; --royal:#2E5FD0; --gold:#F2B705; --red:#C8102E;
    --bg:#F5F3EE; --card:#FFFFFF; --ink:#0E1A2E; --muted:#6B7486; --line:#E7E3DA; --soft:#EFECE4;
    --shadow:0 1px 1px rgba(10,31,68,.04),0 8px 24px rgba(10,31,68,.07);
  }
  [data-theme="dark"]{
    --bg:#0A1120; --card:#131C2F; --ink:#EEF2F8; --muted:#8E9AB0; --line:#212C42; --soft:#1A2438;
    --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
  .serif{font-family:"New York","Iowan Old Style",Georgia,"Times New Roman",serif}

  /* ---------- Karşılama ---------- */
  .hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;
    padding:calc(16px + env(safe-area-inset-top)) 20px 54px}
  .hero .art{position:absolute;right:-118px;bottom:-150px;width:290px;height:290px;opacity:.9;pointer-events:none}
  .top{display:flex;align-items:center;justify-content:space-between;position:relative}
  .mark{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;letter-spacing:1.6px}
  .mark svg{width:30px;height:30px}
  .day{font-size:12.5px;opacity:.7;text-align:right;line-height:1.3}
  .hi{position:relative;margin-top:26px;font-size:34px;line-height:1.08;font-weight:600;letter-spacing:-.6px}
  .hi em{font-style:italic;color:var(--gold);font-weight:500}
  .summary{position:relative;margin-top:10px;font-size:14px;opacity:.82;max-width:235px}
  .bar{position:absolute;left:0;right:0;bottom:0;height:4px;display:flex}
  .bar b{flex:1;background:var(--gold)} .bar b+b{background:var(--royal)}

  /* ---------- Arama ---------- */
  .search{position:relative;z-index:2;margin:-24px 16px 0;display:flex;align-items:center;gap:10px;background:var(--card);
    border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:9px 0}
  .search input::placeholder{color:var(--muted)}
  .search button{background:var(--navy);color:#fff;font-weight:700;padding:10px 14px;border-radius:12px;font-size:13.5px}
  [data-theme="dark"] .search button{background:var(--royal)}

  main{padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
  h2.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px;font-size:13px;
    font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
  h2.sec button{font-size:13px;letter-spacing:0;text-transform:none;color:var(--royal);font-weight:600}

  /* ---------- Brifing ızgarası ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
  .tile{position:relative;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px;min-height:118px;
    display:flex;flex-direction:column;overflow:hidden;transition:transform .15s}
  .tile:active{transform:scale(.97)}
  .tile.wide{grid-column:1/-1;min-height:0}
  .tile .acc{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0}
  .th{display:flex;align-items:center;gap:8px}
  .th .e{font-size:18px}
  .th b{font-size:15px;letter-spacing:-.1px;line-height:1.2}
  .tm{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  .tm.new{color:#B38600} [data-theme="dark"] .tm.new{color:var(--gold)}
  .lead{margin-top:auto;padding-top:10px;font-size:13.5px;line-height:1.35;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tile.wide .lead{-webkit-line-clamp:2}
  .leads{list-style:none;margin:10px 0 0;padding:0}
  .leads li{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35}
  .leads li:first-child{border-top:0;padding-top:2px}
  .leads em{font-style:normal;color:var(--red);font-weight:800;font-size:12px;padding-top:2px}
  .wait{margin-top:auto;padding-top:10px;font-size:12.5px;color:var(--muted)}
  .wait b{color:var(--ink);font-weight:600}
  .cnt{position:absolute;right:12px;bottom:12px;font-size:11px;font-weight:800;color:var(--muted);background:var(--soft);
    padding:3px 7px;border-radius:999px}

  /* ---------- Sinyaller ---------- */
  .sigs{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:4px 14px;margin-bottom:22px}
  .sig{display:flex;gap:12px;width:100%;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
  .sig:first-child{border-top:0}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--red);margin-top:6px;flex:none;box-shadow:0 0 0 4px rgba(200,16,46,.12)}
  .dot.w{background:var(--gold);box-shadow:0 0 0 4px rgba(242,183,5,.18)} .dot.b{background:var(--royal);box-shadow:0 0 0 4px rgba(46,95,208,.14)}
  .sig div{flex:1;min-width:0}
  .sig b{display:block;font-size:14px;font-weight:600;line-height:1.35}
  .sig span{font-size:12px;color:var(--muted)}
  .nosig{padding:16px 0;color:var(--muted);font-size:13.5px}

  /* ---------- Hızlı işlemler ---------- */
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .act{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
  .act i{font-style:normal;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--soft);font-size:16px}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:20px;letter-spacing:.3px}

  /* ---------- Alt sayfa ---------- */
  .sheet{position:fixed;inset:0;background:var(--bg);z-index:20;transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sheet.on{transform:none}
  .sh{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 18px}
  .sh .x{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top));width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.12);font-size:16px;text-align:center}
  .sh small{opacity:.7;font-size:12.5px} .sh h3{margin:4px 0 0;font-size:24px;font-weight:600;letter-spacing:-.4px;padding-right:40px}
  .sh .bar{height:3px}
  .sb{padding:16px 16px calc(30px + env(safe-area-inset-bottom))}
  .frame{border-left:3px solid var(--gold);padding:4px 0 4px 12px;font-style:italic;margin:0 0 14px;font-size:15px;color:var(--muted)}
  .it{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:15px;margin-bottom:10px}
  .it .n{font-weight:800;color:var(--red);font-size:12.5px;letter-spacing:.6px}
  .it h4{margin:3px 0 6px;font-size:16.5px;line-height:1.35;font-weight:600}
  .it p{margin:6px 0;font-size:14px} .it .k{font-weight:700} .it .q{color:var(--muted);font-style:italic}
  .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .lk{font-size:12.5px;padding:6px 10px;border-radius:10px;background:var(--soft);color:var(--royal);font-weight:600}
  .concept{background:var(--navy);color:#fff;border-radius:18px;padding:18px;margin-top:4px}
  .concept small{color:var(--gold);font-weight:800;letter-spacing:1px;font-size:11px}
  .concept h4{margin:4px 0 6px;font-size:20px;font-weight:600}
  .concept p{margin:0;opacity:.86;font-size:14px}
  .cta{position:sticky;bottom:0;padding:12px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
  .btn{display:block;width:100%;text-align:center;padding:13px 0;border-radius:14px;font-weight:700;font-size:14.5px;background:var(--navy);color:#fff}
  [data-theme="dark"] .btn{background:var(--royal)}
  .chips{display:flex;gap:7px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--navy);color:#fff} [data-theme="dark"] .chip.on{background:var(--royal)}
  .row{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;margin-bottom:8px}
  .row .e{font-size:20px} .row div{flex:1;min-width:0} .row b{display:block;font-size:14.5px} .row span{font-size:12.5px;color:var(--muted)}
  .dl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}

  /* ---------- Durumlar ---------- */
  .sk{background:linear-gradient(90deg,var(--soft) 25%,var(--line) 37%,var(--soft) 63%);background-size:400% 100%;
    animation:sk 1.3s ease infinite;border-radius:20px;height:118px}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:30px;background:var(--navy);color:#fff;position:relative;overflow:hidden}
  .gate .art{position:absolute;right:-90px;bottom:-120px;width:340px;height:340px}
  .gate svg.lg{width:76px;height:76px;margin-bottom:18px;position:relative}
  .gate h1{margin:0 0 8px;font-size:26px;font-weight:600;position:relative} .gate p{opacity:.8;margin:0 0 20px;max-width:310px;position:relative}
  .gate code{background:rgba(255,255,255,.12);padding:3px 8px;border-radius:8px}
  .gate a{position:relative;background:var(--gold);color:var(--navy);text-decoration:none;font-weight:700;padding:12px 20px;border-radius:13px}
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;
    background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:13px;font-size:13.5px;font-weight:600;z-index:40;
    transition:.25s;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .fade{animation:fade .35s ease both} @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"><div style="min-height:100vh;background:#0A1F44;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 13px -apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:2px">
  <svg viewBox="0 0 100 100" width="64" height="64"><circle cx="50" cy="50" r="49" fill="#0A1F44" stroke="rgba(255,255,255,.35)" stroke-width="2"/><text x="50" y="57" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="27" fill="#fff">AFB</text><rect x="30" y="63" width="20" height="3" fill="#F2B705"/><rect x="50" y="63" width="20" height="3" fill="#2E5FD0"/></svg>
  <div style="margin-top:14px;opacity:.75">BRİFİNG YÜKLENİYOR…</div></div></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
const API = "https://stydttrfgxirsofgtyhn.supabase.co/functions/v1/miniapp-api";
let tg = null;
let rendered = false;
const DEMO = new URLSearchParams(location.search).has("demo");

const KINDS = {
  bolge:     {label:"Ankara 3. Bölge", icon:"📍", c:"#1F7A5A", next:["08:00","13:00","19:00"]},
  turkiye:   {label:"Türkiye",         icon:"🇹🇷", c:"#C8102E", next:["07:30"]},
  dunya:     {label:"Dünya",           icon:"🌍", c:"#2E5FD0", next:["07:45"]},
  akparti:   {label:"AK Parti",        icon:"🏛", c:"#D9822B", next:["18:00"]},
  ankaragucu:{label:"Ankaragücü",      icon:"⚽", c:"#F2B705", next:["10:00"]},
};
const ORDER = ["bolge","turkiye","dunya","akparti","ankaragucu"];

const LOGO = `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49" fill="#0A1F44" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
<text x="50" y="57" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="27" fill="#fff">AFB</text>
<rect x="30" y="63" width="20" height="3" fill="#F2B705"/><rect x="50" y="63" width="20" height="3" fill="#2E5FD0"/></svg>`;

/* Sanatsal arka plan: yükselen güneş gibi iç içe yaylar */
const ART = `<svg class="art" viewBox="0 0 300 300" aria-hidden="true">
  ${[140,118,96,74,52].map((r,i)=>`<circle cx="150" cy="150" r="${r}" fill="none" stroke="${i%2?'#2E5FD0':'#F2B705'}" stroke-width="${i===4?26:1.4}" opacity="${i===4?.95:.55-i*.05}"/>`).join("")}
  <circle cx="150" cy="150" r="26" fill="#F2B705"/>
  ${Array.from({length:12},(_,i)=>{const a=(i/12)*Math.PI*2;return `<line x1="${150+Math.cos(a)*34}" y1="${150+Math.sin(a)*34}" x2="${150+Math.cos(a)*44}" y2="${150+Math.sin(a)*44}" stroke="#F2B705" stroke-width="2" stroke-linecap="round" opacity=".7"/>`}).join("")}
</svg>`;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = {feed:null, archive:[], archiveKind:"", archiveDone:false};

function haptic(t="light"){ try{ tg?.HapticFeedback?.impactOccurred(t) }catch(e){} }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2800); }
function openLink(u){ haptic(); tg?.openLink ? tg.openLink(u) : window.open(u,"_blank"); }
function ago(ts){ const d=(Date.now()-new Date(ts))/1000;
  if(d<60) return "az önce"; if(d<3600) return Math.floor(d/60)+" dk"; if(d<86400) return Math.floor(d/3600)+" sa";
  return new Date(ts).toLocaleDateString("tr-TR",{day:"numeric",month:"short"}); }
function hhmm(ts){ return new Date(ts).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}); }
function dayLabel(ts){ const d=new Date(ts),t=new Date(),y=new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString()) return "Bugün"; if(d.toDateString()===y.toDateString()) return "Dün";
  return d.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"}); }
function nextTime(k){ const now=new Date(), hm=now.toTimeString().slice(0,5); return KINDS[k].next.find(t=>t>hm) || KINDS[k].next[0]+" (yarın)"; }

async function api(action, extra={}){
  if(DEMO) return demoApi(action, extra);
  const ctl = new AbortController(); const tmo = setTimeout(()=>ctl.abort(), 15000);
  const r = await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,
    body:JSON.stringify({initData: tg?.initData || "", action, ...extra})}).finally(()=>clearTimeout(tmo));
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.error||"hata"),{status:r.status,data:j});
  return j;
}

/* ---------------- Açılış ekranı ---------------- */
function home(){
  const F=state.feed||{}, L=F.latest||{}, A=F.alerts||[], now=new Date(), h=now.getHours();
  const hi = h<6?"İyi geceler":h<12?"Günaydın":h<18?"İyi günler":"İyi akşamlar";
  const name = F.user?.name ? `, <em>${esc(F.user.name)}</em>` : "";
  const todayB = Object.values(L).filter(b=>new Date(b.ts).toDateString()===now.toDateString()).length;
  const sig24 = A.filter(a=>Date.now()-new Date(a.ts)<86400e3).length;
  const summary = `Bugün ${todayB} brifing hazır${sig24?`, son 24 saatte ${sig24} önemli gelişme var.`:"."}`;

  const tile = (k, wide) => {
    const m=KINDS[k], b=L[k], items=b?.report?.items||[];
    const fresh = b && Date.now()-new Date(b.ts)<6*3600e3;
    const body = items.length
      ? (wide ? `<ul class="leads">${items.slice(0,3).map((x,i)=>`<li><em>${String(i+1).padStart(2,"0")}</em><span>${esc(x.title)}</span></li>`).join("")}</ul>`
              : `<div class="lead">${esc(items[0].title)}</div>`)
      : `<div class="wait">Sıradaki: <b>${nextTime(k)}</b><br>Dokun, şimdi hazırlansın</div>`;
    return `<button class="tile ${wide?"wide":""} fade" data-k="${k}"><span class="acc" style="background:${m.c}"></span>
      <div class="th"><span class="e">${m.icon}</span><b>${m.label}</b><span class="tm ${fresh?"new":""}">${b?ago(b.ts):""}</span></div>
      ${body}</button>`;
  };

  const sigRows = A.slice(0,3).map((a,i)=>{ const p=a.payload||{};
    const cls=/Bölge|parti/i.test(p.reason)?"b":/Son dakika/i.test(p.reason)?"":"w";
    return `<button class="sig" data-s="${i}"><span class="dot ${cls}"></span><div><b>${esc(p.title)}</b>
      <span>${hhmm(a.ts)} · ${esc(p.reason||"")} · ${p.sources||1} kaynak</span></div></button>`; }).join("");

  $("#app").innerHTML = `
  <header class="hero">${ART}
    <div class="top"><div class="mark">${LOGO}AFB BRİFİNG</div>
      <div class="day">${now.toLocaleDateString("tr-TR",{weekday:"long"})}<br>${now.toLocaleDateString("tr-TR",{day:"numeric",month:"long"})}</div></div>
    <div class="hi serif">${hi}${name}</div>
    <div class="summary">${summary}</div>
    <div class="bar"><b></b><b></b></div>
  </header>
  <form class="search" id="sf"><span>🔎</span><input id="q" placeholder="Bir konu ara: Sincan metro, faiz…" enterkeyhint="search"><button>Ara</button></form>
  <main>
    <h2 class="sec">Brifingler</h2>
    ${Object.keys(L).length?"":`<button class="tile wide fade" id="all" style="background:var(--navy);color:#fff;margin-bottom:10px">
      <div class="th"><span class="e">✨</span><b>İlk brifingleri hazırlayalım</b></div>
      <div class="wait" style="color:rgba(255,255,255,.8)">Beş brifingin hepsi 1-2 dakika içinde hazırlanıp buraya ve Telegram'a gelir.</div>
      <div class="btn" style="margin-top:12px;background:var(--gold);color:var(--navy)">Tümünü şimdi hazırla</div></button>`}
    <div class="grid">${tile("bolge",true)}${["turkiye","dunya","akparti","ankaragucu"].map(k=>tile(k,false)).join("")}</div>
    <h2 class="sec">Son sinyaller ${A.length>3?`<button id="allsig">Tümü (${A.length})</button>`:""}</h2>
    <div class="sigs">${sigRows || `<div class="nosig">Şimdilik sakin. Önemli bir gelişme olduğunda burada ve Telegram'da görünür.</div>`}</div>
    <div class="acts">
      <button class="act" id="scan"><i>📡</i>Şimdi tara</button>
      <button class="act" id="arc"><i>🗂</i>Arşiv</button>
    </div>
    <div class="foot">Ahmet Fethan Baykoç · Ankara Milletvekili</div>
  </main>`;

  $("#sf").onsubmit=(e)=>{e.preventDefault(); const q=$("#q").value.trim(); if(q.length<2) return; $("#q").blur(); run("konu",q);};
  document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{ const k=t.dataset.k;
    if(L[k]?.report?.items?.length) openReport(L[k]); else askRun(k); });
  document.querySelectorAll(".sig").forEach(s=>s.onclick=()=>openSignals());
  $("#allsig")?.addEventListener("click",openSignals);
  $("#scan").onclick=()=>run("sinyal","");
  $("#arc").onclick=openArchive;
  $("#all")?.addEventListener("click",async()=>{ haptic("medium"); let ok=0;
    for(const k of ORDER){ try{ const r=await api("run",{komut:"briefing",arg:k}); if(r.ok) ok++; }catch(e){} }
    toast(ok?`${ok} brifing hazırlanıyor — 1-2 dk sonra uygulamayı yenileyin`:"Başlatılamadı, tekrar deneyin");
    if(ok){ $("#all").style.opacity=.5; $("#all").disabled=true; setTimeout(async()=>{ try{state.feed=await api("feed"); home();}catch(e){} },120000); } });
}

function askRun(k){
  haptic(); const msg=`${KINDS[k].label} brifingi şimdi hazırlansın mı?`;
  if(tg?.showConfirm && !DEMO) tg.showConfirm(msg,(ok)=>ok&&run("briefing",k)); else if(confirm(msg)) run("briefing",k);
}

/* ---------------- Alt sayfalar ---------------- */
function sheet(title, sub, body){
  $("#sheet").innerHTML = `<div class="sh"><button class="x" id="cls">✕</button><small>${sub}</small><h3 class="serif">${title}</h3><div class="bar"><b></b><b></b></div></div><div class="sb">${body}</div>`;
  const s=$("#sheet"); s.scrollTop=0; s.classList.add("on");
  s.querySelectorAll("[data-u]").forEach(x=>x.onclick=()=>openLink(x.dataset.u));
  $("#cls").onclick=closeSheet;
  if(tg?.BackButton){ tg.BackButton.show(); tg.BackButton.onClick(closeSheet); }
}
function closeSheet(){ $("#sheet").classList.remove("on"); if(tg?.BackButton){ tg.BackButton.hide(); tg.BackButton.offClick(closeSheet);} }
const linkBtns = (ls)=>`<div class="links">${(ls||[]).map(([n,u])=>`<button class="lk" data-u="${esc(u)}">${esc(n)} ↗</button>`).join("")}</div>`;

function openReport(b){
  haptic("medium"); const r=b.report||{}, m=KINDS[b.kind]||{icon:"📌",label:b.kind};
  const items=(r.items||[]).map((x,i)=>`<div class="it"><div class="n">${String(i+1).padStart(2,"0")}</div><h4>${esc(x.title)}</h4>
    ${x.summary?`<p>${esc(x.summary)}</p>`:""}${x.why?`<p><span class="k">Neden önemli:</span> ${esc(x.why)}</p>`:""}
    ${x.extra?`<p><span class="k">${esc(x.extra_label||"Not")}:</span> ${esc(x.extra)}</p>`:""}
    ${x.question?`<p class="q">${esc(x.question)}</p>`:""}${linkBtns(x.links)}</div>`).join("");
  const c=r.concept?.name?`<div class="concept"><small>GÜNÜN KAVRAMI</small><h4 class="serif">${esc(r.concept.name)}</h4><p>${esc(r.concept.text||"")}</p></div>`:"";
  sheet(esc(r.title||m.label), `${m.icon} ${dayLabel(b.ts)} · ${hhmm(b.ts)}`,
    `${r.frame?`<p class="frame serif">${esc(r.frame)}</p>`:""}${items}${c}<div class="cta"><button class="btn" id="rr">↻ Yeniden hazırla</button></div>`);
  $("#rr").onclick=()=>run("briefing",b.kind);
}

function openSignals(){
  haptic(); const A=state.feed?.alerts||[]; let last="", html="";
  for(const a of A){ const p=a.payload||{}, d=dayLabel(a.ts);
    if(d!==last){ html+=`<div class="dl">${esc(d)}</div>`; last=d; }
    html+=`<div class="it"><div class="n" style="color:var(--muted)">${hhmm(a.ts)} · ${esc(p.reason||"")} · ${p.sources||1} kaynak</div>
      <h4>${esc(p.title)}</h4>${p.summary?`<p>${esc(p.summary)}</p>`:""}${linkBtns(p.links)}</div>`; }
  sheet("Sinyaller","Brifing dışındaki önemli gelişmeler", html||`<p class="frame">Henüz sinyal yok.</p>`);
}

function openArchive(){ haptic(); sheet("Arşiv","Geçmiş brifingler",`<div id="arcb"><div class="sk"></div></div>`); loadArchive(true); }
async function loadArchive(reset){
  if(reset){ state.archive=[]; state.archiveDone=false; }
  try{ const r=await api("archive",{kind:state.archiveKind,offset:state.archive.length});
    state.archive=state.archive.concat(r.items||[]); state.archiveDone=(r.items||[]).length<30; }catch(e){ toast("Arşiv yüklenemedi"); }
  let html=`<div class="chips">${[["","Tümü"],...ORDER.map(k=>[k,KINDS[k].icon+" "+KINDS[k].label])].map(([k,l])=>`<button class="chip ${state.archiveKind===k?"on":""}" data-k="${k}">${l}</button>`).join("")}</div>`, last="";
  state.archive.forEach((b,i)=>{ const m=KINDS[b.kind]||{icon:"📌",label:b.kind}, d=dayLabel(b.ts);
    if(d!==last){ html+=`<div class="dl">${esc(d)}</div>`; last=d; }
    html+=`<button class="row" data-i="${i}"><span class="e">${m.icon}</span><div><b>${esc(b.report?.title||m.label)}</b><span>${hhmm(b.ts)} · ${(b.report?.items||[]).length} başlık</span></div>›</button>`; });
  if(!state.archive.length) html+=`<p class="frame">Arşivde henüz brifing yok.</p>`;
  if(!state.archiveDone&&state.archive.length) html+=`<button class="btn" id="more" style="background:var(--soft);color:var(--ink)">Daha fazla</button>`;
  const box=$("#arcb"); if(!box) return; box.innerHTML=html;
  box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{haptic();state.archiveKind=c.dataset.k;loadArchive(true)});
  box.querySelectorAll(".row").forEach(r=>r.onclick=()=>openReport(state.archive[+r.dataset.i]));
  $("#more")?.addEventListener("click",()=>loadArchive(false));
}

async function run(komut,arg){
  haptic("medium");
  try{ const r=await api("run",{komut,arg});
    if(r.ok){ try{tg?.HapticFeedback?.notificationOccurred("success")}catch(e){}
      toast(komut==="konu"?`“${arg}” aranıyor — sonuç Telegram'a gelecek`:"Hazırlanıyor — 1-2 dk içinde Telegram'a gelecek"); }
    else toast("Başlatılamadı, tekrar deneyin"); }catch(e){ toast("Bağlantı hatası"); }
}

function gate(t,m,l){ $("#app").innerHTML=`<div class="gate">${ART.replace('class="art"','class="art"')}<svg class="lg" viewBox="0 0 100 100">${LOGO.replace(/<\/?svg[^>]*>/g,"")}</svg><h1 class="serif">${t}</h1><p>${m}</p>${l||""}</div>`; }

async function boot(){
  tg = (window.Telegram && window.Telegram.WebApp) || null;
  if(tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor("#0A1F44"); }catch(e){} }
  const qs=new URLSearchParams(location.search);
  document.documentElement.dataset.theme = qs.get("theme") || (tg?.colorScheme==="dark"?"dark":"light");
  try{ tg?.setBackgroundColor(getComputedStyle(document.body).backgroundColor); }catch(e){}
  if(!DEMO && !tg?.initData){ gate("AFB Brifing","Bu uygulama Telegram'da <b>@AFBBrifingbot</b> sohbetindeki <b>Brifing</b> düğmesinden açılır.",`<a href="?demo=1">Önizlemeyi gör</a>`); return; }
  $("#app").innerHTML=`<header class="hero" style="height:230px">${ART}</header><main><div class="grid"><div class="sk" style="grid-column:1/-1"></div><div class="sk"></div><div class="sk"></div></div></main>`;
  try{ state.feed=await api("feed"); home(); rendered=true; }
  catch(e){
    if(e.status===403) gate("Yetki gerekli",`Bu uygulamayı yalnızca ofis ekibi kullanabilir.<br><br>Telegram kimliğiniz: <code>${esc(e.data?.user_id)}</code><br>Bu numarayı ofis yöneticisine iletin.`);
    else if(e.status===401) gate("Doğrulanamadı","Uygulamayı Telegram'dan kapatıp yeniden açın.");
    else gate("Bağlantı sorunu","Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.",`<a href="javascript:location.reload()">Yeniden dene</a>`);
  }
}

/* ---------------- Önizleme verisi (gerçek haber değildir) ---------------- */

    turkiye:{kind:"turkiye",ts:h(11),report:rep("turkiye","Türkiye: Ekonomi ve Siyaset",[

    dunya:{kind:"dunya",ts:h(10.8),report:rep("dunya","Dünya: Ekonomi ve Siyaset",[
      {title:"Örnek: Büyük ekonomiler arasında yeni gümrük vergisi turu",why:"Türk ihracatçısı için hem risk hem fırsat.",links:L("Uluslararası Yayın")},
      {title:"Örnek: Enerji fiyatlarında haftalık yükseliş",links:L("İş Dünyası Yayını")}],"ÖRNEK İÇERİK — gerçek haber değildir.")},
    ankaragucu:{kind:"ankaragucu",ts:h(8.5),report:rep("ankaragucu","Ankaragücü",[
      {title:"Örnek: Takım hafta sonu maçının hazırlıklarını sürdürdü",links:L("Spor Gazetesi")}])},
  };
  if(action==="feed") return {user:{name:"Sinan"},latest:(new URLSearchParams(location.search).has("bos")?{}:latest),alerts:[

    {ts:h(2.1),payload:{reason:"5 farklı kaynakta",sources:5,title:"Örnek: Ankara'da büyük altyapı projesi için ihale sonucu açıklandı",summary:"Proje bölgedeki iki ilçeyi kapsıyor.",links:L("Ulusal Ajans","Gazete","Yerel Haber")}},
    {ts:h(26),payload:{reason:"Son dakika niteliğinde",sources:3,title:"Örnek: Merkez Bankası faiz kararını açıkladı",links:L("Ekonomi Kanalı")}}]};
  if(action==="archive") return {items:Object.values(latest).filter(b=>!state.archiveKind||b.kind===state.archiveKind)};

window.addEventListener("error",(e)=>{ if(rendered) return;
  gate("Bir sorun oluştu",`Uygulama açılamadı. Lütfen tekrar deneyin.<br><br><code style="font-size:11px">${esc(e.message||"")}</code>`,`<a href="javascript:location.reload()">Yeniden dene</a>`); });
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
</script>
